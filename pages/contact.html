<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta Vola Acrobatics — Book Alta Vola for Your Next Event</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="../index.html" class="logo"><img src="../assets/Logos/alta-vola-logo-color.svg" alt="Alta Vola Acrobatics"></a>
    <nav class="main-nav">
      <a href="../index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="team.html">Team</a>
      <a href="contact.html" class="nav-book active">Book Alta Vola for Your Next Event</a>
    </nav>
  </header>

  <section class="contact-intro">
    <h1>Book Alta Vola for Your Next Event</h1>
    <p>
      If you're interested in getting in touch or booking us for a gig,
      please fill out our contact form below!
    </p>
  </section>

  <section class="contact-section">
    <!--
      IMPORTANT: replace YOUR_FORM_ID below with your real Formspree
      endpoint after creating a free account at formspree.io.
      It will look like: https://formspree.io/f/abcdwxyz
    -->
    <form class="contact-form" action="https://formspree.io/f/xlgqkbob" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required>
      <input type="hidden" name="_subject" id="subject-hidden" value="New message from Alta Vola Acrobatics site">

      <label for="event-date">Event Date <span class="optional">(optional)</span></label>
      <input type="text" id="event-date" name="event_date" placeholder="e.g. June 14, 2027, or a rough timeframe">

      <label for="event-type">Event Type <span class="optional">(optional)</span></label>
      <input type="text" id="event-type" name="event_type" placeholder="e.g. wedding, corporate party, festival">

      <label for="venue">Indoor or Outdoor Venue <span class="optional">(optional)</span></label>
      <input type="text" id="venue" name="venue" placeholder="Indoor, outdoor, or not sure yet">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <img src="../assets/images/Startof3HighSeq_Everyone.jpg" alt="The whole team at the start of a three-high sequence" class="contact-photo">
  </section>

  <footer class="site-footer">
    <span>Alta Vola Acrobatics — Seattle, WA</span>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
